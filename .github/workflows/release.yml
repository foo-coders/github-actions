name: Release Please

on:
  push:
    branches: [main]

permissions: {}

# Cancelling mid-flight can leave a half-created tag or release behind.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    environment: main-automation
    steps:
      - name: Run Release Please
        uses: $/actions/release-please
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}
          major-rolling-tag: true
