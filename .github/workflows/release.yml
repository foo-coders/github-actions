name: Release Please

on:
  push:
    branches: [main]

permissions: {}

# Two release-please runs racing would act on the same commits, and cancelling
# one mid-flight can leave a half-created tag or release behind. The group is
# not scoped by ref: the only trigger is a push to main, so a ref would name one
# branch the long way round.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    environment: main-automation
    permissions:
      contents: read # required for checkout
    steps:
      # Required to resolve the local composite action below by path.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Release Please
        uses: ./actions/release-please # zizmor: ignore[self-repository]
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}
          major-rolling-tag: true
