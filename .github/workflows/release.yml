name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Required to resolve the local composite action below by path.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./actions/release-please # zizmor: ignore[self-repository]
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APPLICATION_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}
