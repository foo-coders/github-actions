name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

# An edited title makes the check of the previous one obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: Validate PR title
    runs-on: ubuntu-latest
    permissions:
      contents: read # required for checkout
      pull-requests: read # required for conventional-pr-title
    steps:
      # Required to resolve the local composite action below by path.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check PR title
        uses: ./actions/conventional-pr-title # zizmor: ignore[self-repository]
