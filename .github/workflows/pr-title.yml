name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

# An edited title makes the check of the previous one obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: Validate PR title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read # required for conventional-pr-title
    steps:
      - name: Check PR title
        uses: $/actions/conventional-pr-title
