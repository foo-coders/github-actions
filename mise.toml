[settings]
minimum_release_age = "7d"
lockfile = true

[tools]
node = "26"
"npm:prettier" = "3.9.8"
"aqua:actionlint" = "1.7.12"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:zizmor" = "1.30.1"

[tasks.format]
description = "Format files with prettier"
run = "prettier --write ."

[tasks."lint:format"]
run = "prettier --check ."

[tasks."lint:actionlint"]
run = "actionlint"

[tasks."lint:zizmor"]
run = "zizmor --persona pedantic .github actions"

[tasks."lint:shellcheck"]
shell = "bash -euo pipefail -c"
run = "git ls-files -z --cached --others --exclude-standard '*.sh' | xargs -0 -r shellcheck"

[tasks.lint]
depends = [ "lint:format", "lint:actionlint", "lint:zizmor", "lint:shellcheck" ]

[tasks."test:mise-update"]
run = "bash actions/mise-update/scripts/engine.test.sh"

[tasks."test:release-please"]
run = "bash actions/release-please/scripts/build-released.test.sh"

[tasks.test]
depends = [ "test:mise-update", "test:release-please" ]
