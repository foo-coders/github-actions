[tools]
node = "26"
"npm:prettier" = "3.9.6"
"aqua:actionlint" = "1.7.12"
"aqua:zizmor" = "1.30.0"

[tasks.format]
description = "Format files with prettier"
run = "prettier --write ."

[tasks."lint:format"]
run = "prettier --check ."

[tasks."lint:actionlint"]
run = "actionlint"

[tasks."lint:zizmor"]
run = "zizmor .github actions"

[tasks.lint]
depends = [ "lint:format", "lint:actionlint", "lint:zizmor" ]

[tasks."test:release-please"]
run = "bash actions/release-please/scripts/build-released.test.sh"

[tasks.test]
depends = [ "test:release-please" ]
