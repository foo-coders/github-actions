[settings]
# Hold a freshly-published version back, so one that is yanked or hotfixed in
# its first week never reaches this repo. This governs every mise command run
# here, not just the weekly update run. mise's own default is 24h.
minimum_release_age = "7d"
lockfile = true

[tools]
node = "26"
"npm:prettier" = "3.9.6"
"aqua:actionlint" = "1.7.12"
"aqua:zizmor" = "1.30.1"

[tasks.format]
description = "Format files with prettier"
run = "prettier --write ."

[tasks."lint:format"]
run = "prettier --check ."

[tasks."lint:actionlint"]
run = "actionlint"

[tasks."lint:zizmor"]
# pedantic adds undocumented-permissions and concurrency-limits. It has no
# .github/zizmor.yml equivalent, so the flag is the only option.
run = "zizmor --persona pedantic .github actions"

[tasks.lint]
depends = [ "lint:format", "lint:actionlint", "lint:zizmor" ]

[tasks."test:mise-update"]
run = "bash actions/mise-update/scripts/engine.test.sh"

[tasks."test:release-please"]
run = "bash actions/release-please/scripts/build-released.test.sh"

[tasks.test]
depends = [ "test:mise-update", "test:release-please" ]
