name: Release Please
description: Run Release Please to manage releases from Conventional Commits.

inputs:
  app-id:
    description: GitHub App client ID used to mint an installation token.
    required: true
  private-key:
    description: GitHub App private key used to mint an installation token.
    required: true
  target-branch:
    description: Branch Release Please should track. Defaults to the branch the workflow runs on.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # A GITHUB_TOKEN-authored PR cannot trigger further workflow runs (GitHub
    # blocks this to avoid recursive runs), so release-please's PRs would
    # never get CI checks. Minting a GitHub App token works around that.
    - name: Get Token
      id: get-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        permission-contents: write
        permission-issues: write
        permission-pull-requests: write
    - name: Run release-please
      uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
      with:
        token: ${{ steps.get-token.outputs.token }}
        target-branch: ${{ inputs.target-branch || github.ref_name }}
