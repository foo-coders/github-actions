name: mise update
description: Propose mise manifest and lockfile updates as a single pull request.

inputs:
  client-id:
    description: GitHub App client ID used to mint an installation token.
    required: true
  private-key:
    description: GitHub App private key used to mint an installation token.
    required: true
  working-directory:
    description: Directory mise runs in. Must hold a mise manifest and a mise lockfile.
    required: false
    default: "."
  branch:
    description: Pull request branch. Defaults to one derived from the working directory. See this action's README ("Branch naming").
    required: false
    default: ""
  commit-prefix:
    description: Conventional Commits prefix for the commit and pull request title.
    required: false
    default: chore(deps)
  labels:
    description: Labels to apply to the pull request, one per line. Every label must already exist in the repository.
    required: false
    default: ""
  mise-version:
    description: Version of mise to install. When empty, the newest mise release at least 7 days old is used.
    required: false
    default: ""

outputs:
  pull-requests:
    description: 'JSON array of the pull requests this run proposed, as `[{"pull-request-number": ..., "pull-request-url": ..., "pull-request-operation": ...}]`. Empty array (`[]`) when nothing was proposed.'
    value: ${{ steps.build-output.outputs.pull-requests }}

runs:
  using: composite
  steps:
    # A GITHUB_TOKEN-authored PR cannot trigger further workflow runs (GitHub
    # blocks this to avoid recursive runs), which would leave every update PR
    # without the CI that is the only thing verifying the new versions.
    - name: Get token
      id: get-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        permission-contents: write
        permission-pull-requests: write
    - name: Derive branch
      id: derive-branch
      shell: bash
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        BRANCH: ${{ inputs.branch }}
      run: |
        echo "branch=$(bash "$GITHUB_ACTION_PATH/scripts/engine.sh" branch)" >> "$GITHUB_OUTPUT"
    # install: false is what keeps the run free of toolchain downloads — the
    # engine needs the mise binary, not the tools. cache: false follows from
    # it: with nothing installed, upstream restores a cache it never saves.
    # github_token keeps version resolution off the unauthenticated rate
    # limit, which matters because resolving versions is the whole job.
    # minimum_release_age asks for an aged mise binary and is ignored by
    # upstream when version is set, so both are passed unconditionally.
    - name: Setup mise
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        version: ${{ inputs.mise-version }}
        minimum_release_age: 7d
        install: false
        cache: false
        github_token: ${{ steps.get-token.outputs.token }}
        wings_enabled: false
    # Must come before anything that reads config: a manifest carrying a
    # [settings] block — which is exactly what the cooldown documentation
    # tells consumers to add — makes mise hard-error on an untrusted config,
    # including on the preflight check below. Trusting a directory with no
    # config at all is a no-op, so this cannot mask a mistyped path.
    - name: Trust config
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: mise trust .
    # mise never errors on a missing lockfile — it silently proceeds — so a
    # mistyped working-directory would otherwise produce a green job that has
    # checked nothing.
    - name: Preflight
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        # A missing actions/checkout step leaves the workspace empty, which
        # lands here as a missing manifest. It is the likeliest way to
        # misconfigure this action, hence the hint.
        if ! mise config ls --json |
          jq -e --arg dir "$PWD" 'any(.[]; .path | startswith($dir + "/"))' >/dev/null; then
          echo "::error title=mise-update::no mise manifest in $PWD - make sure the repository is checked out"
          exit 1
        fi
        if [ ! -f mise.lock ]; then
          echo "::error title=mise-update::no mise lockfile (mise.lock) in $PWD"
          exit 1
        fi
    # --local keeps the runner's global configuration out of scope, so the
    # action can only ever propose changes to the consumer's project. A
    # registry that fails here costs its tools, not the whole run: discovery
    # falls back to an empty result and the lockfile pass still proposes what
    # it can.
    - name: Discover outdated tools
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        OUTDATED_PATH: ${{ runner.temp }}/mise-update-outdated.json
        DISCOVER_LOG: ${{ runner.temp }}/mise-update-discover.log
      run: |
        mise outdated --bump --json --local >"$OUTDATED_PATH" 2>"$DISCOVER_LOG" || true
        if ! jq -e . "$OUTDATED_PATH" >/dev/null 2>&1; then
          echo "::warning title=mise-update::could not read outdated tools; proposing lockfile changes only"
          echo '{}' >"$OUTDATED_PATH"
        fi
    - name: Plan updates
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        OUTDATED_PATH: ${{ runner.temp }}/mise-update-outdated.json
        PLAN_PATH: ${{ runner.temp }}/mise-update-plan.json
      run: |
        # An edit to an untracked config could never reach the pull request,
        # so the engine needs to know which sources git actually tracks.
        # The `if` matters: a bare `&&` would make the loop — and so the step —
        # exit non-zero as soon as a source is untracked, which is exactly the
        # case this filter exists to report.
        tracked=$(jq -r '[.[].source.path // empty] | unique | .[]' "$OUTDATED_PATH" |
          while IFS= read -r path; do
            if git ls-files --error-unmatch -- "$path" >/dev/null 2>&1; then
              echo "$path"
            fi
          done)
        OUTDATED="$(cat "$OUTDATED_PATH")" TRACKED_PATHS="$tracked" \
          bash "$GITHUB_ACTION_PATH/scripts/engine.sh" plan >"$PLAN_PATH"
    # `mise config set` edits configuration without installing anything, so
    # mise owns the TOML edit and this action parses no TOML itself. The
    # dotted key path must be written unquoted for backend-prefixed tools:
    # quoting it silently appends a malformed duplicate key instead of
    # updating the real one.
    - name: Apply manifest bumps
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PLAN_PATH: ${{ runner.temp }}/mise-update-plan.json
      run: |
        while IFS=$'\t' read -r name to path; do
          [ -z "$name" ] && continue
          mise config set --file "$path" "tools.$name" "$to"
        done < <(jq -r '.bumps[] | [.name, .to, .path] | @tsv' "$PLAN_PATH")
    # Runs after the manifest edits so the lockfile is consistent with the new
    # manifest. --global is deliberately absent: on this subcommand it selects
    # the runner's global lockfile rather than restricting scope.
    - name: Refresh lockfile
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        LOCK_PATH: ${{ runner.temp }}/mise-update-lock.json
        LOCK_LOG: ${{ runner.temp }}/mise-update-lock.log
      run: |
        mise lock --bump --json >"$LOCK_PATH" 2>"$LOCK_LOG" || true
        if ! jq -e . "$LOCK_PATH" >/dev/null 2>&1; then
          echo "::warning title=mise-update::could not read lockfile changes"
          echo '[]' >"$LOCK_PATH"
        fi
    # Annotations are what make problems visible on a run that produces no
    # pull request at all — the case where everything errored.
    - name: Render pull request
      id: render
      shell: bash
      env:
        COMMIT_PREFIX: ${{ inputs.commit-prefix }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        WORKSPACE: ${{ github.workspace }}
        PLAN_PATH: ${{ runner.temp }}/mise-update-plan.json
        LOCK_PATH: ${{ runner.temp }}/mise-update-lock.json
        BODY_PATH: ${{ runner.temp }}/mise-update-body.md
        DISCOVER_LOG: ${{ runner.temp }}/mise-update-discover.log
        LOCK_LOG: ${{ runner.temp }}/mise-update-lock.log
      run: |
        PLAN="$(cat "$PLAN_PATH")"
        LOCK_CHANGES="$(cat "$LOCK_PATH")"
        export PLAN LOCK_CHANGES
        engine="$GITHUB_ACTION_PATH/scripts/engine.sh"

        title=$(bash "$engine" render title)
        echo "title=$title" >>"$GITHUB_OUTPUT"
        bash "$engine" render body >"$BODY_PATH"
        bash "$engine" render annotations

        {
          echo "add-paths<<PATHS_EOF"
          bash "$engine" render add-paths
          echo "PATHS_EOF"
        } >>"$GITHUB_OUTPUT"

        # A tool mise cannot resolve at all is absent from the discovery
        # output entirely, so a warning is the only trace it leaves. Reading
        # those warnings is best-effort — they are not a stable interface —
        # and never fails the run. They repeat across both logs, hence the
        # de-duplication.
        grep -h 'WARN' "$DISCOVER_LOG" "$LOCK_LOG" 2>/dev/null |
          sed -e 's|^mise WARN *||' -e 's|^|::warning title=mise-update::|' |
          sort -u || true
    # sign-commits attributes the commit to the GitHub App that minted the
    # token, and makes create-pull-request ignore the committer and author
    # inputs. delete-branch cleans the branch up once the proposal is no
    # longer needed.
    - name: Create pull request
      id: create-pull-request
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        token: ${{ steps.get-token.outputs.token }}
        branch: ${{ steps.derive-branch.outputs.branch }}
        add-paths: ${{ steps.render.outputs.add-paths }}
        title: ${{ steps.render.outputs.title }}
        body-path: ${{ runner.temp }}/mise-update-body.md
        commit-message: ${{ steps.render.outputs.title }}
        labels: ${{ inputs.labels }}
        sign-commits: true
        delete-branch: true
        draft: false
        signoff: false
        maintainer-can-modify: true
    # An array rather than an object, so that per-tool pull requests, if added
    # later, extend it without breaking callers.
    - name: Build pull-requests output
      id: build-output
      shell: bash
      env:
        NUMBER: ${{ steps.create-pull-request.outputs.pull-request-number }}
        URL: ${{ steps.create-pull-request.outputs.pull-request-url }}
        OPERATION: ${{ steps.create-pull-request.outputs.pull-request-operation }}
      run: |
        pull_requests=$(jq -c -n \
          --arg number "$NUMBER" --arg url "$URL" --arg operation "$OPERATION" \
          'if $number == "" then []
           else [{"pull-request-number": ($number | tonumber),
                  "pull-request-url": $url,
                  "pull-request-operation": $operation}]
           end')
        echo "pull-requests=$pull_requests" >>"$GITHUB_OUTPUT"
