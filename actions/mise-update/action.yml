name: Mise update
description: Propose mise manifest and lockfile updates as a single pull request.

inputs:
  client-id:
    description: GitHub App client ID used to mint an installation token.
    required: true
  private-key:
    description: GitHub App private key used to mint an installation token.
    required: true
  working-directory:
    description: Directory mise runs in. Must hold a mise manifest and a mise lockfile.
    required: false
    default: "."
  branch:
    description: Pull request branch. Defaults to one derived from the working directory. See this action's README ("Branch naming").
    required: false
    default: ""
  commit-prefix:
    description: Conventional Commits prefix for the commit and pull request title.
    required: false
    default: chore(deps)
  labels:
    description: Labels to apply to the pull request, one per line. Every label must already exist in the repository.
    required: false
    default: ""
  mise-version:
    description: Version of mise to install. When empty, the newest mise release at least 7 days old is used.
    required: false
    default: ""

outputs:
  pull-requests:
    description: 'JSON array of the pull requests this run proposed, as `[{"pull-request-number": ..., "pull-request-url": ..., "pull-request-operation": ...}]`. Empty array (`[]`) when nothing was proposed.'
    value: ${{ steps.build-output.outputs.pull-requests }}

runs:
  using: composite
  steps:
    - name: Get token
      id: get-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        permission-contents: write
        permission-pull-requests: write
    - name: Derive branch
      id: derive-branch
      shell: bash
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        BRANCH: ${{ inputs.branch }}
      run: |
        echo "branch=$(bash "$GITHUB_ACTION_PATH/scripts/engine.sh" branch)" >> "$GITHUB_OUTPUT"
    - name: Setup mise
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        version: ${{ inputs.mise-version }}
        minimum_release_age: 7d # ignored upstream when version is set
        install: false # the engine needs the mise binary, not the tools
        cache: false # with nothing installed, upstream never saves one
        github_token: ${{ steps.get-token.outputs.token }} # avoids the unauthenticated rate limit
        wings_enabled: false
    # Before anything reads config: mise hard-errors on an untrusted [settings] block.
    - name: Trust config
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: mise trust .
    - name: Preflight
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if ! mise config ls --json |
          jq -e --arg dir "$PWD" 'any(.[]; .path | startswith($dir + "/"))' >/dev/null; then
          echo "::error title=mise-update::no mise manifest in $PWD - make sure the repository is checked out"
          exit 1
        fi
        if [ ! -f mise.lock ]; then
          echo "::error title=mise-update::no mise lockfile (mise.lock) in $PWD"
          exit 1
        fi
    - name: Discover outdated tools
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        OUTDATED_PATH: ${{ runner.temp }}/mise-update-outdated.json
        DISCOVER_LOG: ${{ runner.temp }}/mise-update-discover.log
      run: |
        mise outdated --bump --json --local >"$OUTDATED_PATH" 2>"$DISCOVER_LOG" || true
        if ! jq -e . "$OUTDATED_PATH" >/dev/null 2>&1; then
          echo "::warning title=mise-update::could not read outdated tools; proposing lockfile changes only"
          echo '{}' >"$OUTDATED_PATH"
        fi
    - name: Plan updates
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        OUTDATED_PATH: ${{ runner.temp }}/mise-update-outdated.json
        PLAN_PATH: ${{ runner.temp }}/mise-update-plan.json
      run: |
        tracked=$(jq -r '[.[].source.path // empty] | unique | .[]' "$OUTDATED_PATH" |
          while IFS= read -r path; do
            if git ls-files --error-unmatch -- "$path" >/dev/null 2>&1; then
              echo "$path"
            fi
          done)
        OUTDATED="$(cat "$OUTDATED_PATH")" TRACKED_PATHS="$tracked" \
          bash "$GITHUB_ACTION_PATH/scripts/engine.sh" plan >"$PLAN_PATH"
    - name: Apply manifest bumps
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PLAN_PATH: ${{ runner.temp }}/mise-update-plan.json
      run: |
        while IFS=$'\t' read -r name to path; do
          [ -z "$name" ] && continue
          mise config set --file "$path" "tools.$name" "$to"
        done < <(jq -r '.bumps[] | [.name, .to, .path] | @tsv' "$PLAN_PATH")
    - name: Refresh lockfile
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        LOCK_PATH: ${{ runner.temp }}/mise-update-lock.json
        LOCK_LOG: ${{ runner.temp }}/mise-update-lock.log
      run: |
        mise lock --bump --json >"$LOCK_PATH" 2>"$LOCK_LOG" || true
        if ! jq -e . "$LOCK_PATH" >/dev/null 2>&1; then
          echo "::warning title=mise-update::could not read lockfile changes"
          echo '[]' >"$LOCK_PATH"
        fi
    - name: Render pull request
      id: render
      shell: bash
      env:
        COMMIT_PREFIX: ${{ inputs.commit-prefix }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        WORKSPACE: ${{ github.workspace }}
        PLAN_PATH: ${{ runner.temp }}/mise-update-plan.json
        LOCK_PATH: ${{ runner.temp }}/mise-update-lock.json
        BODY_PATH: ${{ runner.temp }}/mise-update-body.md
        DISCOVER_LOG: ${{ runner.temp }}/mise-update-discover.log
        LOCK_LOG: ${{ runner.temp }}/mise-update-lock.log
      run: |
        PLAN="$(cat "$PLAN_PATH")"
        LOCK_CHANGES="$(cat "$LOCK_PATH")"
        export PLAN LOCK_CHANGES
        engine="$GITHUB_ACTION_PATH/scripts/engine.sh"

        title=$(bash "$engine" render title)
        echo "title=$title" >>"$GITHUB_OUTPUT"
        bash "$engine" render body >"$BODY_PATH"
        bash "$engine" render annotations

        {
          echo "add-paths<<PATHS_EOF"
          bash "$engine" render add-paths
          echo "PATHS_EOF"
        } >>"$GITHUB_OUTPUT"

        # An unresolvable tool leaves only a warning; best-effort, as warnings are no stable interface.
        grep -h 'WARN' "$DISCOVER_LOG" "$LOCK_LOG" 2>/dev/null |
          sed -e 's|^mise WARN *||' -e 's|^|::warning title=mise-update::|' |
          sort -u || true
    - name: Create pull request
      id: create-pull-request # zizmor: ignore[superfluous-actions]
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        token: ${{ steps.get-token.outputs.token }}
        branch: ${{ steps.derive-branch.outputs.branch }}
        add-paths: ${{ steps.render.outputs.add-paths }}
        title: ${{ steps.render.outputs.title }}
        body-path: ${{ runner.temp }}/mise-update-body.md
        commit-message: ${{ steps.render.outputs.title }}
        labels: ${{ inputs.labels }}
        sign-commits: true # attributes the commit to the app
        delete-branch: true
        draft: false
        signoff: false
        maintainer-can-modify: true
    # An array, so per-tool pull requests can be added without breaking callers.
    - name: Build pull-requests output
      id: build-output
      shell: bash
      env:
        NUMBER: ${{ steps.create-pull-request.outputs.pull-request-number }}
        URL: ${{ steps.create-pull-request.outputs.pull-request-url }}
        OPERATION: ${{ steps.create-pull-request.outputs.pull-request-operation }}
      run: |
        pull_requests=$(jq -c -n \
          --arg number "$NUMBER" --arg url "$URL" --arg operation "$OPERATION" \
          'if $number == "" then []
           else [{"pull-request-number": ($number | tonumber),
                  "pull-request-url": $url,
                  "pull-request-operation": $operation}]
           end')
        echo "pull-requests=$pull_requests" >>"$GITHUB_OUTPUT"
